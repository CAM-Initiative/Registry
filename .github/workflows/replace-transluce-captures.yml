name: Replace Transluce incident captures

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/replace-transluce-captures.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture human-readable Transluce report excerpts
        run: |
          cat > replace-transluce.js <<'JS'
          const { chromium } = require('playwright');

          const targets = [
            {
              out: 'VIGIL/VIGIL-INC-000161.png',
              needle: 'Agents targeted University of New Mexico',
              label: 'UNM incident narrative'
            },
            {
              out: 'VIGIL/VIGIL-INC-000175.png',
              needle: 'Agents targeted Data USA',
              label: 'Data USA incident narrative'
            },
            {
              out: 'VIGIL/VIGIL-INC-000172.png',
              needle: 'Agents targeted the Australian Institute of Health and Welfare',
              label: 'AIHW incident narrative'
            },
            {
              out: 'VIGIL/VIGIL-INC-000172-02.png',
              needle: 'None of the hacking attempts we identified appear to have succeeded',
              label: 'Transluce limitations and outcome summary'
            }
          ];

          async function captureAround(page, target) {
            const loc = page.getByText(target.needle, { exact: false }).first();
            if (!(await loc.count())) {
              throw new Error('Could not find target text: ' + target.needle);
            }

            await loc.scrollIntoViewIfNeeded();
            await page.waitForTimeout(350);

            // Centre the matched explanatory passage in a clean desktop viewport.
            await loc.evaluate((el) => {
              const y = el.getBoundingClientRect().top + window.scrollY;
              window.scrollTo({ top: Math.max(0, y - 170), behavior: 'instant' });
            });
            await page.waitForTimeout(400);

            // Hide only sticky/floating site chrome that can cover report text.
            await page.addStyleTag({ content: `
              header[style*="position: fixed"],
              header[style*="position: sticky"],
              nav[style*="position: fixed"],
              nav[style*="position: sticky"],
              [class*="sticky"][style*="position"],
              [class*="fixed"][style*="position"] {
                visibility: hidden !important;
              }
            `});

            const bodyText = (await page.locator('body').innerText()).replace(/\s+/g,' ');
            if (!bodyText.includes(target.needle)) {
              throw new Error('Target disappeared before capture: ' + target.needle);
            }

            console.log('CAPTURE', target.label, '::', target.needle);
            console.log('SCROLL', await page.evaluate(() => Math.round(window.scrollY)));
            await page.screenshot({
              path: target.out,
              fullPage: false,
              animations: 'disabled'
            });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            for (const target of targets) {
              const context = await browser.newContext({
                viewport: { width: 1440, height: 1000 },
                deviceScaleFactor: 1,
                colorScheme: 'light',
                locale: 'en-US'
              });
              const page = await context.newPage();
              const response = await page.goto('https://transluce.org/agent-activity', {
                waitUntil: 'networkidle',
                timeout: 90000
              });
              if (!response || response.status() >= 400) {
                throw new Error('Failed to load Transluce report');
              }

              await page.waitForTimeout(800);
              await captureAround(page, target);
              await context.close();
            }

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS

          node replace-transluce.js
          file VIGIL/VIGIL-INC-000161.png
          file VIGIL/VIGIL-INC-000172.png
          file VIGIL/VIGIL-INC-000172-02.png
          file VIGIL/VIGIL-INC-000175.png
          sha256sum \
            VIGIL/VIGIL-INC-000161.png \
            VIGIL/VIGIL-INC-000172.png \
            VIGIL/VIGIL-INC-000172-02.png \
            VIGIL/VIGIL-INC-000175.png

      - name: Commit replacement captures and clean temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f replace-transluce.js
          git add -- \
            VIGIL/VIGIL-INC-000161.png \
            VIGIL/VIGIL-INC-000172.png \
            VIGIL/VIGIL-INC-000172-02.png \
            VIGIL/VIGIL-INC-000175.png
          git rm -f .github/workflows/replace-transluce-captures.yml
          git rm -f .github/workflows/inspect-transluce-report.yml || true
          git status --short
          git diff --cached --name-status
          git commit -m "Replace Transluce captures with report excerpts"
          git push

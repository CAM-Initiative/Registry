name: One-shot Transluce log capture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-transluce.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture public urlquery reports
        run: |
          cat > /tmp/capture.js <<'JS'
          const { chromium } = require('playwright');
          const shots = [
            {
              incident: 'VIGIL-INC-000161',
              out: 'VIGIL/VIGIL-INC-000161.png',
              url: 'https://urlquery.net/report/82593154-3a4f-4d3e-a6fc-99c02b87cfbd'
            },
            {
              incident: 'VIGIL-INC-000175',
              out: 'VIGIL/VIGIL-INC-000175.png',
              url: 'https://urlquery.net/report/01fd9706-d9d0-42e4-b813-448a541a2571'
            },
            {
              incident: 'VIGIL-INC-000172',
              out: 'VIGIL/VIGIL-INC-000172.png',
              url: 'https://urlquery.net/report/52e02785-083a-4bca-915c-28e1c7bfce01'
            },
            {
              incident: 'VIGIL-INC-000172',
              out: 'VIGIL/VIGIL-INC-000172-02.png',
              url: 'https://urlquery.net/report/09308100-6f6c-4b81-a55a-92618e9de812'
            }
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1600, height: 1600 },
              deviceScaleFactor: 1,
              colorScheme: 'light',
              locale: 'en-US'
            });

            for (const shot of shots) {
              const page = await context.newPage();
              const response = await page.goto(shot.url, { waitUntil: 'networkidle', timeout: 90000 });
              if (!response || response.status() >= 400) {
                throw new Error(`${shot.incident}: failed to load ${shot.url}; status=${response && response.status()}`);
              }
              await page.waitForTimeout(2500);
              console.log(`CAPTURE ${shot.incident}: ${await page.title()} :: ${page.url()}`);
              const body = (await page.locator('body').innerText()).replace(/\s+/g, ' ').slice(0, 2500);
              console.log(`TEXT ${shot.incident}: ${body}`);
              await page.screenshot({ path: shot.out, fullPage: false, animations: 'disabled' });
              await page.close();
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node /tmp/capture.js
          file VIGIL/VIGIL-INC-000161.png VIGIL/VIGIL-INC-000172.png VIGIL/VIGIL-INC-000172-02.png VIGIL/VIGIL-INC-000175.png
          sha256sum VIGIL/VIGIL-INC-000161.png VIGIL/VIGIL-INC-000172.png VIGIL/VIGIL-INC-000172-02.png VIGIL/VIGIL-INC-000175.png

      - name: Commit captures and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VIGIL/VIGIL-INC-000161.png VIGIL/VIGIL-INC-000172.png VIGIL/VIGIL-INC-000172-02.png VIGIL/VIGIL-INC-000175.png
          git rm .github/workflows/capture-transluce.yml
          git commit -m 'Add Transluce urlquery incident captures'
          git push

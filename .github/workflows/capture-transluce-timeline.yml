name: Capture Transluce timeline evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-transluce-timeline.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture source timeline and incident-focused crops
        run: |
          cat > capture-timeline.js <<'JS'
          const { chromium } = require('playwright');

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:1600,height:1200},
              deviceScaleFactor:2,
              colorScheme:'light',
              locale:'en-US'
            });
            const page=await context.newPage();
            const r=await page.goto('https://transluce.org/agent-activity',{waitUntil:'networkidle',timeout:90000});
            if(!r||r.status()>=400) throw new Error('Failed to load Transluce report');

            const timeline=page.locator('[class*="UrlqueryTimeline_articleFigure"]').first();
            if(!(await timeline.count())) throw new Error('Timeline figure not found');
            await timeline.scrollIntoViewIfNeeded();
            await page.waitForTimeout(600);

            const box=await timeline.boundingBox();
            if(!box) throw new Error('Timeline figure has no bounding box');

            console.log('TIMELINE BOX',JSON.stringify(box));
            console.log('TIMELINE TEXT',(await timeline.innerText()).replace(/\s+/g,' ').trim());

            // Full source figure for cluster-level context.
            await timeline.screenshot({
              path:'VIGIL/VIGIL-INC-000172-02.png',
              animations:'disabled'
            });

            const width=620;
            const specs=[
              {out:'VIGIL/VIGIL-INC-000161.png', relCenter:676, label:'UNM'},
              {out:'VIGIL/VIGIL-INC-000175.png', relCenter:737, label:'Data USA'},
              {out:'VIGIL/VIGIL-INC-000172.png', relCenter:886, label:'AIHW'}
            ];

            for(const s of specs){
              const relX=Math.max(0,Math.min(box.width-width,s.relCenter-width/2));
              const clip={
                x:box.x+relX,
                y:box.y,
                width:Math.min(width,box.width-relX),
                height:box.height
              };
              console.log('CROP',s.label,JSON.stringify({relX,clip}));
              await page.screenshot({
                path:s.out,
                animations:'disabled',
                clip
              });
            }

            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
          node capture-timeline.js
          file VIGIL/VIGIL-INC-000161.png VIGIL/VIGIL-INC-000172.png VIGIL/VIGIL-INC-000172-02.png VIGIL/VIGIL-INC-000175.png
          sha256sum VIGIL/VIGIL-INC-000161.png VIGIL/VIGIL-INC-000172.png VIGIL/VIGIL-INC-000172-02.png VIGIL/VIGIL-INC-000175.png
      - name: Commit timeline captures and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f capture-timeline.js
          git add -- VIGIL/VIGIL-INC-000161.png VIGIL/VIGIL-INC-000172.png VIGIL/VIGIL-INC-000172-02.png VIGIL/VIGIL-INC-000175.png
          git rm .github/workflows/capture-transluce-timeline.yml
          git commit -m "Use Transluce timeline as incident visual evidence"
          git push

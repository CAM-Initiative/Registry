name: Inspect Transluce report structure

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-transluce-report.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inspect Transluce page
        run: |
          cat > inspect-transluce.js <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1200 },
              deviceScaleFactor: 1,
              colorScheme: 'light',
              locale: 'en-US'
            });

            const url = 'https://transluce.org/agent-activity';
            const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
            if (!response || response.status() >= 400) throw new Error('Failed to load Transluce report');

            console.log('TITLE', await page.title());
            const heads = await page.locator('h1,h2,h3,h4').evaluateAll(nodes =>
              nodes.map((n,i)=>({i,tag:n.tagName,text:(n.innerText||'').trim()}))
            );
            console.log('HEADINGS', JSON.stringify(heads));

            const imgs = await page.locator('img').evaluateAll(nodes =>
              nodes.map((n,i)=>({i,alt:n.alt||'',src:n.getAttribute('src')||'',w:n.naturalWidth,h:n.naturalHeight}))
            );
            console.log('IMAGES', JSON.stringify(imgs));

            const needles = [
              'University of New Mexico',
              'Data USA',
              'Australian Institute of Health and Welfare'
            ];
            for (const needle of needles) {
              const h = page.getByRole('heading', { name: new RegExp(needle, 'i') }).first();
              console.log('MATCH', needle, 'count=', await h.count());
              if (await h.count()) {
                const info = await h.evaluate(el => {
                  let cur = el;
                  const trail = [];
                  for (let i=0; i<5 && cur; i++, cur=cur.parentElement) {
                    trail.push({
                      tag: cur.tagName,
                      cls: cur.className || '',
                      text: (cur.innerText || '').replace(/\s+/g,' ').slice(0,1800),
                      html: (cur.outerHTML || '').slice(0,5000)
                    });
                  }
                  return trail;
                });
                console.log('ANCESTORS', needle, JSON.stringify(info));
              }
            }

            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node inspect-transluce.js

      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-transluce-report.yml
          git commit -m "Remove one-shot Transluce inspection workflow"
          git push

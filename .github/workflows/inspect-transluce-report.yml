name: Inspect Transluce report structure

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-transluce-report.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inspect Transluce hacking section
        run: |
          cat > inspect-transluce.js <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1200 },
              deviceScaleFactor: 1,
              colorScheme: 'light',
              locale: 'en-US'
            });
            const response = await page.goto('https://transluce.org/agent-activity', { waitUntil: 'networkidle', timeout: 90000 });
            if (!response || response.status() >= 400) throw new Error('Failed to load report');

            const h2 = page.getByRole('heading', { name: 'Hacking attempts against public data providers' });
            const section = await h2.evaluate(el => {
              const rows = [];
              let n = el;
              for (let i=0; i<50 && n; i++, n=n.nextElementSibling) {
                const r=n.getBoundingClientRect();
                rows.push({
                  i,
                  tag:n.tagName,
                  cls:n.className||'',
                  y:Math.round(r.y+window.scrollY),
                  h:Math.round(r.height),
                  text:(n.innerText||'').replace(/\s+/g,' ').trim().slice(0,1800)
                });
                if (i>0 && n.tagName==='H2') break;
              }
              return rows;
            });
            console.log('SECTION', JSON.stringify(section));

            const needles = [
              'University of New Mexico',
              'Data USA',
              'Australian Institute of Health and Welfare',
              'None of the hacking attempts we identified appear to have succeeded'
            ];
            for (const needle of needles) {
              const loc = page.getByText(needle, { exact:false }).first();
              console.log('MATCH', needle, 'count=', await loc.count());
              if (await loc.count()) {
                const trail=await loc.evaluate(el=>{
                  let cur=el;
                  const out=[];
                  for(let i=0;i<6 && cur;i++,cur=cur.parentElement){
                    const r=cur.getBoundingClientRect();
                    out.push({
                      tag:cur.tagName,
                      cls:cur.className||'',
                      y:Math.round(r.y+window.scrollY),
                      h:Math.round(r.height),
                      text:(cur.innerText||'').replace(/\s+/g,' ').trim().slice(0,2200)
                    });
                  }
                  return out;
                });
                console.log('TRAIL', needle, JSON.stringify(trail));
              }
            }
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1);});
          JS
          node inspect-transluce.js

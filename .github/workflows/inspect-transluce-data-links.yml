name: Inspect Transluce data release links

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-transluce-data-links.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect report links
        run: |
          cat > inspect-links.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1200},locale:'en-US'});
            const r=await page.goto('https://transluce.org/agent-activity',{waitUntil:'networkidle',timeout:90000});
            if(!r||r.status()>=400) throw new Error('load failed');
            const links=await page.locator('a').evaluateAll(nodes=>nodes.map((a,i)=>({
              i,
              text:(a.innerText||'').replace(/\s+/g,' ').trim(),
              href:a.href,
              download:a.getAttribute('download')
            })).filter(x=>x.text||x.href));
            console.log('LINKS',JSON.stringify(links));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
          node inspect-links.js
      - name: Remove workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-transluce-data-links.yml
          git commit -m "Remove Transluce data-link inspection workflow" || true
          git push || true

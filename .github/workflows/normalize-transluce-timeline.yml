name: Normalize Transluce timeline artefacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize-transluce-timeline.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false
      - name: Use complete source timeline for each incident
        run: |
          cp VIGIL/VIGIL-INC-000172-02.png VIGIL/VIGIL-INC-000161.png
          cp VIGIL/VIGIL-INC-000172-02.png VIGIL/VIGIL-INC-000172.png
          cp VIGIL/VIGIL-INC-000172-02.png VIGIL/VIGIL-INC-000175.png
          rm VIGIL/VIGIL-INC-000172-02.png
      - name: Commit and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- VIGIL/VIGIL-INC-000161.png VIGIL/VIGIL-INC-000172.png VIGIL/VIGIL-INC-000175.png
          git rm -- VIGIL/VIGIL-INC-000172-02.png
          git rm .github/workflows/normalize-transluce-timeline.yml
          git commit -m "Use complete Transluce timeline for incident context"
          git push

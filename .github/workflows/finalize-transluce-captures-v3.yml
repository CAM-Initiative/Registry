name: Finalize Transluce incident captures v3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-transluce-captures-v3.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture expanded Transluce incident panels
        run: |
          cat > finalize-transluce.js <<'JS'
          const { chromium } = require('playwright');

          const incidentTargets = [
            {
              out: 'VIGIL/VIGIL-INC-000161.png',
              title: 'Agents targeted University of New Mexico’s digital library using exploits like SQL injection and path traversal'
            },
            {
              out: 'VIGIL/VIGIL-INC-000175.png',
              title: 'Agents targeted Data USA with cross-site scripting and other exploits'
            },
            {
              out: 'VIGIL/VIGIL-INC-000172.png',
              title: 'Agents targeted the Australian Institute of Health and Welfare'
            }
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });

            for (const target of incidentTargets) {
              const context = await browser.newContext({
                viewport: { width: 1440, height: 1200 },
                deviceScaleFactor: 1,
                colorScheme: 'light',
                locale: 'en-US'
              });
              const page = await context.newPage();
              const response = await page.goto('https://transluce.org/agent-activity', {
                waitUntil: 'networkidle',
                timeout: 90000
              });
              if (!response || response.status() >= 400) throw new Error('Failed to load report');

              const details = page.locator('details').filter({ hasText: target.title }).first();
              if (!(await details.count())) throw new Error('Missing incident panel: ' + target.title);

              await details.evaluate(el => { el.open = true; });
              await details.scrollIntoViewIfNeeded();
              await page.waitForTimeout(500);

              const text = (await details.innerText()).replace(/\s+/g, ' ').trim();
              console.log('PANEL', target.title, '::', text.slice(0, 2200));

              await details.screenshot({
                path: target.out,
                animations: 'disabled'
              });
              await context.close();
            }

            // Fourth capture: tightly bounded plain-English overview and limitation statement.
            {
              const context = await browser.newContext({
                viewport: { width: 1440, height: 1000 },
                deviceScaleFactor: 1,
                colorScheme: 'light',
                locale: 'en-US'
              });
              const page = await context.newPage();
              const response = await page.goto('https://transluce.org/agent-activity', {
                waitUntil: 'networkidle',
                timeout: 90000
              });
              if (!response || response.status() >= 400) throw new Error('Failed to load report');
              const h2 = page.getByRole('heading', { name: 'Hacking attempts against public data providers' });
              const p = h2.locator('xpath=following-sibling::p[1]');
              await p.scrollIntoViewIfNeeded();
              await page.waitForTimeout(350);
              console.log('OVERVIEW', (await p.innerText()).replace(/\\s+/g,' ').trim());
              await p.screenshot({
                path: 'VIGIL/VIGIL-INC-000172-02.png',
                animations: 'disabled'
              });
              await context.close();
            }

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS

          node finalize-transluce.js
          file VIGIL/VIGIL-INC-000161.png
          file VIGIL/VIGIL-INC-000172.png
          file VIGIL/VIGIL-INC-000172-02.png
          file VIGIL/VIGIL-INC-000175.png
          sha256sum \
            VIGIL/VIGIL-INC-000161.png \
            VIGIL/VIGIL-INC-000172.png \
            VIGIL/VIGIL-INC-000172-02.png \
            VIGIL/VIGIL-INC-000175.png

      - name: Commit final report captures and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f finalize-transluce.js
          git add -- \
            VIGIL/VIGIL-INC-000161.png \
            VIGIL/VIGIL-INC-000172.png \
            VIGIL/VIGIL-INC-000172-02.png \
            VIGIL/VIGIL-INC-000175.png
          git rm .github/workflows/finalize-transluce-captures-v3.yml
          git rm -f .github/workflows/finalize-transluce-captures.yml || true
          git rm -f .github/workflows/finalize-transluce-captures-v2.yml || true
          git status --short
          git diff --cached --name-status
          git commit -m "Use expanded Transluce incident report captures"
          git push
